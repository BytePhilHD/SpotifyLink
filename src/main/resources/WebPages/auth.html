<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spotify Link</title>
  </head>
  <body>
    <h1>Thanks, your account should now be authenticated!</h1>
    <h3>You can now close this tab</h3>
    <h3>Or click <a href="/">here</a> to go back to the main page</h3>

    <script>
      window.onload = setupWebSocket;
      let codeSent = false;

      function setupWebSocket() {
        if (location.protocol === "http:") {
          ws = new WebSocket(
            "ws://" + location.hostname + ":" + location.port + "/auth"
          );
        } else {
          ws = new WebSocket(
            "wss://" + location.hostname + ":" + location.port + "/auth"
          );
        }

        ws.onopen = (openEvent) => {
          console.log("INFO - Connection to Server established!");
          const code = new URLSearchParams(location.search).get("code");
          if (code && !codeSent) {
            codeSent = true;
            ws.send(code);
          }
        };
        ws.onmessage = (messageEvent) => {
          window.location.href = "/?" + messageEvent.data;
        }
        ws.onclose = (closeEvent) => {};
        ws.onerror = (errorEvent) => {
          console.log("Server Error!");
        };
      }
    </script>
  </body>
</html>
